[project]
name = "nathan"
version = "0.1.3"
description = "Free multi-model AI engine: many free-tier models in parallel, one answer out"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.40",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "httpx2>=2.16.0",
    "keyring>=25.7.0",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "pyperclip>=1.11.0",
    "pywebview>=6.2.1; sys_platform == 'darwin'",
    "platformdirs>=4.14.0",
]

[dependency-groups]
dev = [
    "pillow",
    "pyinstaller",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[project.scripts]
nathan = "nathan.cli:app"
nathan-app = "nathan.desktop:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nathan"]
