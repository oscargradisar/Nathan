# Single source of truth for providers and models.
# Free tiers change often — edit this file, never the code.
# Limits are published free-tier figures (Oct 2026); live limits win when providers report them.
#
# tags: what a model is good for (used by the router from Tier 3)
#   fast, cheap, reasoning, code, long_context, writing, judge, planner,
#   tools (supports native function calling; others use the text tool protocol)

providers:
  groq:
    base_url: https://api.groq.com/openai/v1
    key_env: GROQ_API_KEY
    signup: https://console.groq.com/keys
    onboarding:
      method: extension
      key_page: https://console.groq.com/keys
      create_button: ["Create API Key", "Create API key"]
      name_field: ["Display name", "Name", "Enter a name"]
      confirm_button: ["Submit", "Create"]
      key_pattern: 'gsk_[A-Za-z0-9]{40,64}'
    models:
      openai/gpt-oss-120b:
        tags: [reasoning, code, writing, judge, planner, tools]
        limits: {rpm: 30, rpd: 1000, tpd: 200000}
      llama-3.3-70b-versatile:
        tags: [writing, fast, tools]
        limits: {rpm: 30, rpd: 1000, tpd: 100000}
      llama-3.1-8b-instant:
        tags: [fast, cheap]
        limits: {rpm: 30, rpd: 14400, tpd: 500000}

  gemini:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    key_env: GEMINI_API_KEY
    signup: https://aistudio.google.com/apikey
    onboarding:
      method: extension
      key_page: https://aistudio.google.com/apikey
      create_button: ["Create API key", "Create API Key"]
      name_field: ["Name your key", "Key name"]
      confirm_button: ["Create key", "Create API key in new project", "Create"]
      key_pattern: 'AIza[0-9A-Za-z_\-]{35}'
    models:
      # "-latest" aliases follow Google's current Flash models; check AI Studio for your project's limits
      gemini-flash-latest:
        tags: [long_context, reasoning, judge, writing, planner, tools]
        limits: {rpm: 5, rpd: 100}
      gemini-flash-lite-latest:
        tags: [long_context, fast, cheap]
        limits: {rpm: 10, rpd: 500}

  cerebras:
    base_url: https://api.cerebras.ai/v1
    key_env: CEREBRAS_API_KEY
    signup: https://cloud.cerebras.ai
    onboarding:
      method: extension
      key_page: https://cloud.cerebras.ai/platform/apikeys
      create_button: ["Generate API key", "Create API key", "Generate new key"]
      name_field: ["Name", "Key name"]
      confirm_button: ["Generate", "Create"]
      key_pattern: 'csk-[a-z0-9]{40,64}'
    models:
      gpt-oss-120b:
        tags: [reasoning, code, fast, tools]
        limits: {rpm: 30}
      zai-glm-4.7:
        tags: [code, writing]
        limits: {rpm: 30}

  openrouter:
    base_url: https://openrouter.ai/api/v1
    key_env: OPENROUTER_API_KEY
    signup: https://openrouter.ai/keys
    onboarding:
      method: oauth_pkce
      key_page: https://openrouter.ai/auth
      key_pattern: 'sk-or-v1-[a-f0-9]{64}'
    # 50 requests/day across ALL free models on the account — keep this a specialist lane
    account_limits: {rpm: 20, rpd: 50}
    models:
      openrouter/free:
        tags: [writing]
        limits: {}

  mistral:
    base_url: https://api.mistral.ai/v1
    key_env: MISTRAL_API_KEY
    signup: https://console.mistral.ai/api-keys
    onboarding:
      method: extension
      key_page: https://console.mistral.ai/api-keys
      note: "If it asks you to upgrade, pick the free Experiment plan instead (phone check, no card)"
      create_button: ["Create new key", "Create API key"]
      name_field: ["Name", "Key name"]
      confirm_button: ["Create new key", "Create key", "Create"]
      # Mistral keys have no prefix, so only accept them while the Mistral step is active
      key_pattern: '[A-Za-z0-9]{32}'
    models:
      mistral-small-latest:
        tags: [writing, fast, tools]
        limits: {}

  # ---- Tier 5 additions. Keys: paste them with `nathan connect <name>` or in .env ----

  nvidia:
    # build.nvidia.com: free developer access (rate limited, no card). Keys start with nvapi-
    base_url: https://integrate.api.nvidia.com/v1
    key_env: NVIDIA_API_KEY
    signup: https://build.nvidia.com/settings/api-keys
    onboarding:
      method: manual
      key_page: https://build.nvidia.com/settings/api-keys
      key_pattern: 'nvapi-[A-Za-z0-9_\-]{40,90}'
    account_limits: {rpm: 40}
    models:
      moonshotai/kimi-k2.6:
        tags: [reasoning, writing, code, judge, long_context]
        limits: {}
      nvidia/nemotron-3-super-120b-a12b:
        tags: [reasoning, writing]
        limits: {}
      deepseek-ai/deepseek-v4.1-flash:
        tags: [code, reasoning, fast]
        limits: {}

  sambanova:
    # SambaNova Cloud free tier (rate limited). If it ever asks for a card, skip it.
    base_url: https://api.sambanova.ai/v1
    key_env: SAMBANOVA_API_KEY
    signup: https://cloud.sambanova.ai/apis
    onboarding:
      method: manual
      key_page: https://cloud.sambanova.ai/apis
    models:
      Meta-Llama-3.3-70B-Instruct:
        tags: [writing, fast]
        limits: {}
      gpt-oss-120b:
        tags: [reasoning, code, fast]
        limits: {}

  cloudflare:
    # Workers AI free allocation (10,000 "neurons"/day). The URL needs your account id:
    # Connect looks it up with the token (account_id_url), or set CLOUDFLARE_ACCOUNT_ID in .env.
    base_url: https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/v1
    key_env: CLOUDFLARE_API_KEY
    signup: https://dash.cloudflare.com/profile/api-tokens
    onboarding:
      method: manual
      key_page: https://dash.cloudflare.com/profile/api-tokens
      account_id_url: https://api.cloudflare.com/client/v4/accounts
      # Workers AI's OpenAI-style URL has no GET /models (405). This one works for both
      # user tokens and account tokens (cfat_...).
      check_url: https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/models/search?per_page=1
      note: "Create a token with the 'Workers AI' template. Nathan finds your account id by itself."
    models:
      "@cf/meta/llama-3.3-70b-instruct-fp8-fast":
        tags: [writing, fast]
        limits: {}
      "@cf/openai/gpt-oss-120b":
        tags: [reasoning, code]
        limits: {}
